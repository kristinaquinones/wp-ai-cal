name: WordPress Plugin Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: plugin-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Plugin Check advisory
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run WordPress Plugin Check
        continue-on-error: true
        uses: WordPress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          slug: ai-editorial-calendar
          exclude-directories: |
            .claude
            .github
            tests
          exclude-files: |
            .cursorrules
            AGENTS.md
            CLAUDE.md
          ignore-warnings: true
